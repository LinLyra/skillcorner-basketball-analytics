[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillcorner-basketball-analytics"
version = "0.2.0"
description = "Reproducible alignment, defender-policy, and uncertainty audits for SkillCorner open basketball tracking data"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "scikit-learn>=1.4"]
analysis = ["scikit-learn>=1.4"]

[project.scripts]
sc-basketball = "skillcorner_basketball.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
